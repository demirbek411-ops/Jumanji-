async function start(){
 let qs=null;const raw=($("#qj")||{}).value||"";

 if(!qs){
  const cnt=Math.max(5,Math.min(150,parseInt(($("#qc")||{}).value)||60)),f=room.f||"bk",t=room.t||"mix";
  const take=async(tt,n)=>{const pool=BANK.filter(x=>x.f===f&&inT(x,tt)),m=pool.length;if(!m||n<1)return[];
   const key="bank/c_"+f+tt;let cur=0;try{const c=await db.doc(key).get();if(c.exists)cur=c.data().n||0}catch(e){}
   const r=[];for(let k=0;k<Math.min(n,m);k++)r.push(pool[(cur+k)%m]);try{await db.doc(key).set({n:(cur+n)%m})}catch(e){}return r};
  if(t==="mix"){const nu=Math.floor(cnt/5);qs=(await take("k11",cnt-nu)).concat(await take("k10",nu))}else qs=await take(t,cnt);
 }
 qs=qs.filter(x=>x&&x.q&&x.o&&x.o.length>1).map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x);
 await db.doc("rooms/"+code).update({state:"play",qs,q:0,qStart:Date.now()});
}

const LN=BD.lanes.map(pts=>{
 const cum=[0];for(let k=1;k<pts.length;k++)cum.push(cum[k-1]+Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]));
 const T=cum[cum.length-1];
 const at=s=>{s=Math.max(0,Math.min(T,s));let k=1;while(k<cum.length-1&&cum[k]<s)k++;
  const f=(s-cum[k-1])/((cum[k]-cum[k-1])||1),a=pts[k-1],b=pts[k];
  return{x:a[0]+(b[0]-a[0])*f,y:a[1]+(b[1]-a[1])*f}};
 return{T,at};
});
function cellPos(i,ci){const l=LN[ci],p=l.at(i<=0?l.T*.25/N:l.T*(Math.min(i,N)-.5)/N);return{x:p.x,y:p.y,ox:0,oy:0}}
function mix(h,a,t){const c=x=>parseInt(x,16),A=[c(a.slice(1,3)),c(a.slice(3,5)),c(a.slice(5,7))],B=[c(h.slice(1,3)),c(h.slice(3,5)),c(h.slice(5,7))];return"#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("")}
function build(){
 let s=`<svg viewBox="0 0 340 440"><rect x="1.5" y="1.5" width="337" height="437" rx="14" fill="#8a6a22" stroke="#3b2a1d" stroke-width="3"/>`;
 let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647,lc=["#5f7a5a","#7b8f86","#3f5b4a","#a7b39a"];
 for(let i=0;i<170;i++){const x=(8+rnd()*324).toFixed(0),y=(8+rnd()*424).toFixed(0);s+=`<ellipse cx="${x}" cy="${y}" rx="${(5+rnd()*3).toFixed(1)}" ry="2.2" fill="${lc[i%4]}" opacity=".8" transform="rotate(${(rnd()*180).toFixed(0)} ${x} ${y})"/>`}
 s+=`<path d="${BD.sil}" fill="#ecdfb6" stroke="#2a1a0a" stroke-width="2.2" fill-rule="evenodd" stroke-linejoin="round"/>`;
 for(let c=0;c<4;c++){const t1=mix(COLORS[c],"#ecdfb6",.5),t2=mix(COLORS[c],"#ecdfb6",.28);
  for(let i=0;i<N;i++){s+=`<path d="${BD.cells[c][i]}" fill="${i===0?COLORS[c]:(i%2?t1:t2)}" stroke="#2a1a0a" stroke-width=".6" stroke-linejoin="round" fill-rule="evenodd"/>`}}
 s+=`<g id="pawns"></g></svg><div class="gem" id="gem"><div id="qt"></div></div>`;
 app.innerHTML=`<div id="top" class="chips"></div><div class="board" id="bd">${s}</div><div class="msg" id="mg"></div><div id="opts"></div><button id="ok">Tasdiqlash</button><button id="sk" class="alt">⏭ Keyingi savol (xona egasi)</button><div class="chips" id="lg" style="margin-top:8px"></div>`;
 $("#ok").onclick=confirmAns;$("#sk").onclick=adv;built=true;lastQ=-1;endShown=false;
}
function adv(){
 const qi=room.q;
 if(qi+1>=room.qs.length)return db.doc("rooms/"+code).update({state:"done"});
 const mp=Math.max(0,...Object.values(players).map(p=>p.pos)),n=room.dgn||0;
 const dg=!room.dg&&mp>=6&&n<4&&Math.random()<.12+.4*mp/N;
 db.doc("rooms/"+code).update({q:qi+1,qStart:Date.now(),dg,dgn:n+(dg?1:0)});
}
function game(){
 if(!built||!$("#bd"))build();
 const qi=room.q,Q=room.qs[qi],ids=Object.keys(players),dg=!!room.dg;
 $("#pawns").innerHTML=ids.map(i=>{const p=players[i],c=cellPos(p.pos,p.ci),ox=c.ox,oy=c.oy;
  return`<g class="pawn" style="transform:translate(${(c.x+ox).toFixed(1)}px,${(c.y+oy).toFixed(1)}px)"><circle r="6.5" fill="${COLORS[p.ci]}" stroke="${i===uid?"#fff":"#222"}" stroke-width="${i===uid?3:1.5}"/><text y="3" font-size="8" font-weight="bold" text-anchor="middle" fill="#111">${esc(p.name[0]||"?").toUpperCase()}</text></g>`}).join("");
 $("#lg").innerHTML=ids.map(i=>`<div class="chip">${who(players[i],i)}<span>${players[i].pos}/${N}</span></div>`).join("");
 const fin=ids.filter(i=>players[i].pos>=N).sort((a,b)=>(players[a].fin||0)-(players[b].fin||0));
 if(fin.length||room.state==="done")return finish(fin[0]);
 if(qi!==lastQ){lastQ=qi;picked=null;confirming=false;endedAt=0;
  const g=$("#qt");g.className="";g.innerHTML=(dg?'<div style="color:#ffd9d2;font-weight:bold;margin-bottom:3px">⚠️ XAVFLI SAVOL</div>':"")+esc(Q.q);g.style.fontSize=(Q.q.length>90?10:Q.q.length>55?11:13)+"px";void g.offsetWidth;g.className="emerge";
  $("#gem").classList.toggle("danger",dg);
  const o=$("#opts");o.className="";void o.offsetWidth;o.className="appear"}
 const me=answers[qi+"_"+uid],first=firsts["q"+qi],done=ids.every(i=>answers[qi+"_"+i]);
 const allWrong=done&&dg&&ids.every(i=>!answers[qi+"_"+i].ok);
 $("#top").innerHTML=ids.map(i=>{const a=answers[qi+"_"+i];const st=a?(a.ok?"✔ toʻgʻri":"✘ xato"):"…";
  return`<div class="chip ${a?(a.ok?"ok":"bad"):""}">${who(players[i],i)}<span>${st}</span></div>`}).join("");
 const mine=first&&first.pid===uid;
 $("#mg").textContent=allWrong?"💥 Hamma xato qildi — hamma 5 katak orqaga!":me?(me.ok?(mine?"🥇 Birinchi! +2 katak":"✔ Toʻgʻri!"+(first?" +1 katak":"")):(dg?"💥 Xato! 2 katak orqaga":"✘ Xato javob")):dg?"⚠️ Xavfli savol: xato belgilasangiz 2 katak orqaga":first?`🥇 ${first.name} birinchi (+2). Toʻgʻri javob bersangiz +1`:`Savol ${qi+1}/${room.qs.length}`;
 const locked=!!me||done;
 $("#opts").innerHTML=Q.o.map((t,k)=>{let c="opt";if(done&&k===Q.a)c+=" right";else if(!done&&picked===k)c+=" sel";else if(me&&me.choice===k&&!me.ok)c+=" wrong";
  return`<button class="${c}" data-k="${k}" ${locked?"disabled":""}>${"ABCD"[k]}) ${esc(t)}</button>`}).join("");
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{picked=+b.dataset.k;game()});
 $("#ok").disabled=locked||picked===null||confirming;
 $("#sk").style.display=isHost()?"":"none";
}
async function confirmAns(){
 const qi=room.q,Q=room.qs[qi];if(picked===null||confirming)return;
 confirming=true;$("#ok").disabled=true;
 const ok=picked===Q.a,pre=players[uid].pos;
 try{
  await db.doc(`rooms/${code}/ans/${qi}_${uid}`).set({choice:picked,ok,name:myName,t:Date.now(),pre});
  if(ok){
   let first=false;
   try{const r=await db.doc(`rooms/${code}/claims/q${qi}`).acquire({holder:uid,ttlMs:3600000});first=!!(r&&r.acquired)}catch(e){}
   if(first)await db.doc(`rooms/${code}/firsts/q${qi}`).set({pid:uid,name:myName});
   const np=Math.min(N,pre+(first?2:1));
   await db.doc(`rooms/${code}/players/${uid}`).update(np>=N?{pos:np,fin:Date.now()}:{pos:np});
  }else if(room.dg){
   await db.doc(`rooms/${code}/players/${uid}`).update({pos:Math.max(0,pre-2)});
  }
 }catch(e){$("#mg").textContent="Xatolik: "+(e.message||e.code);confirming=false}
}
function tick(){
 if(!room||room.state!=="play"||!isHost())return;
 const qi=room.q,ids=Object.keys(players),done=ids.length&&ids.every(i=>answers[qi+"_"+i]);
 if(!done){endedAt=0;return}
 if(room.dg&&dgLocal!==qi&&ids.every(i=>!answers[qi+"_"+i].ok)){
  dgLocal=qi;
  ids.forEach(i=>{const a=answers[qi+"_"+i];db.doc(`rooms/${code}/players/${i}`).update({pos:Math.max(0,(typeof a.pre==="number"?a.pre:players[i].pos)-5)})});
 }
 if(!endedAt)endedAt=Date.now();
 if(Date.now()-endedAt<3500)return;
 endedAt=0;
 if(Object.values(players).some(p=>p.pos>=N))db.doc("rooms/"+code).update({state:"done"});
 else adv();
}
function confetti(){
 const e=["🎉","✨","🎊","⭐"];
 for(let i=0;i<28;i++){const s=document.createElement("span");s.className="cf";s.textContent=e[i%4];
  s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*1.5+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),6000)}
}
function finish(win){
 if(endShown)return;endShown=true;
 const g=$("#qt"),gem=$("#gem");let h;
 if(win){h=`<div class="emerge"><div style="font-size:34px">🎉</div><div style="font-size:11px;letter-spacing:2px">TABRIKLAYMIZ!</div><div class="wn" style="font-size:20px;font-weight:bold;color:#ffe9a0">${esc(players[win].name)}</div><div style="font-size:12px">gʻolib boʻldi! 🏆</div></div>`;confetti()}
 else{const b=Object.values(players).sort((x,y)=>y.pos-x.pos)[0];h=`<div class="emerge"><div style="font-size:28px">🏁</div><div style="font-size:12px">Savollar tugadi. Eng oldinda:</div><div class="wn" style="font-size:19px;font-weight:bold;color:#ffe9a0">${esc(b?b.name:"—")}</div></div>`}
 g.className="";g.style.fontSize="";g.innerHTML=h;gem.classList.remove("danger");gem.style.boxShadow="0 0 34px #ffd45a,inset 0 0 18px #000a";gem.style.borderColor="#ffd45a";
 $("#opts").style.display="none";$("#mg").textContent="";$("#top").innerHTML="";$("#sk").style.display="none";
 const ok=$("#ok");ok.textContent="Yangi oʻyin";ok.disabled=false;ok.onclick=()=>location.reload();
}
(async()=>{
 login();
 try{db=makeDb()}catch(e){db=null}
 if(!db)login("Bazaga ulanib boʻlmadi. Firebase sozlamalarini (FB) tekshiring.");
})();
